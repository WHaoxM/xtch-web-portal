services:
  postgres:
    image: postgres:16-alpine
    container_name: xtch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xtch
    volumes:
      - xtch_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extra-db.sql:/docker-entrypoint-initdb.d/02-init-extra-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xtch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: xtch-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - xtch_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket bootstrap: public-read bucket for browser-loaded media URLs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: xtch-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/xtch-public --ignore-existing &&
      mc anonymous set download local/xtch-public &&
      mc mb local/xtch-tunnel --ignore-existing &&
      mc anonymous set download local/xtch-tunnel &&
      echo 'MinIO buckets xtch-public + xtch-tunnel ready (public read)'
      "
    restart: "no"

volumes:
  xtch_pg_data:
  xtch_minio_data:
